# Sauti QA - full stack. Run from the repository root:
#   cp .env.example .env   (then edit it)
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# With an NVIDIA GPU for real speech recognition add:  --profile gpu
# See README.md for details.

name: sauti-qa

x-backend: &backend
  build: { context: ../backend, dockerfile: Dockerfile }
  image: sauti-qa/backend:${SAUTI_VERSION:-latest}
  restart: unless-stopped
  env_file: ../.env
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sauti}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sauti}
    REDIS_URL: redis://redis:6379/0
    # local = the shared "storage" volume (default). s3 = any S3-compatible store:
    # the client's own, or the bundled MinIO (--profile s3).
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-sauti}}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-}}
    STORAGE_LOCAL_ROOT: /data/storage
    INBOX_DIR: /data/inbox
    HF_HOME: /models/hf
    HF_CACHE_DIR: /models/hf
  volumes:
    - inbox:/data/inbox
    - storage:/data/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy, required: false }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sauti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sauti}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sauti}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # Optional bundled S3 store (--profile s3). MinIO no longer publishes images on
  # Docker Hub; the official ones are on quay.io. Override MINIO_IMAGE if needed.
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    profiles: ["s3"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sauti}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9001:9001"]  # admin console, localhost only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      retries: 12

  cpu-worker:
    <<: *backend
    # Add ",gpu" to CPU_WORKER_QUEUES when running without a GPU worker (mock or
    # cloud ASR), so transcription jobs are still picked up.
    command: ["sh", "-c", "celery -A app.workers.celery_app worker -Q ${CPU_WORKER_QUEUES:-cpu,llm,maintenance} --concurrency ${CPU_WORKER_CONCURRENCY:-4} --loglevel INFO -n cpu@%h"]
    depends_on:
      api: { condition: service_healthy }

  gpu-worker:
    <<: *backend
    profiles: ["gpu"]
    build: { context: ../backend, dockerfile: Dockerfile.gpu }
    image: sauti-qa/backend-gpu:${SAUTI_VERSION:-latest}
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "gpu", "--concurrency", "1", "--loglevel", "INFO", "-n", "gpu@%h"]
    environment:
      <<: *backend-env
      ASR_DEVICE: cuda
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - storage:/data/storage
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    depends_on:
      api: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel", "INFO", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      api: { condition: service_healthy }

  inbox:
    <<: *backend
    command: ["python", "-m", "app.services.ingest.inbox"]
    depends_on:
      api: { condition: service_healthy }

  # Optional SFTP endpoint for the call recorder, writing into the watched inbox.
  sftp:
    image: atmoz/sftp:alpine
    profiles: ["sftp"]
    restart: unless-stopped
    command: ["${SFTP_USER:-recorder}:${SFTP_PASSWORD:-change-me}:10001:10001:upload"]
    volumes:
      - inbox:/home/${SFTP_USER:-recorder}/upload
    ports: ["${SFTP_PORT:-2222}:22"]

  web:
    build: { context: ../web }
    image: sauti-qa/web:${SAUTI_VERSION:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web, api]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  inbox:
  storage:
  models:
