  - id: C20-hold-without-permission
    title: Agent puts the customer on hold abruptly and never thanks them
    tags: [hold]
    defaults: good
    expected: {hold_etiquette: no, empathy: "?", probing: "?"}
    lines:
      - [A, "Karibu Vodacom, naitwa Juma, nikusaidie nini?"]
      - [C, "Nataka kuhamisha salio la muda wa maongezi kwenda kwa mama yangu."]
      - [A, "Pole, naomba majina yako na tarehe ya kuzaliwa."]
      - [C, "Felista Kimaro, tarehe sita mwezi wa kumi na mbili elfu moja mia tisa tisini."]
