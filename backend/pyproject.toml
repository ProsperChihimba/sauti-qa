[project]
name = "sauti-qa"
version = "0.1.0"
description = "AI quality assurance for Swahili call centres"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "jiwer>=3.0",
    # Cloud / OpenAI-compatible clients. They are only used when a provider is
    # explicitly configured; nothing is sent anywhere by default.
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
# Installed in the GPU worker image only.
gpu = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "faster-whisper>=1.0",
    "pyannote.audio>=3.3",
    "silero-vad>=5.1",
    "soundfile>=0.12",
]
# Fine-tuning script dependencies.
train = [
    "datasets>=2.20",
    "evaluate>=0.4",
    "peft>=0.12",
]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
