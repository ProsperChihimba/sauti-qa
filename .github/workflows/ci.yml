name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gpu_image:
        description: "Also build the GPU worker image (large, ~10 min)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sauti
          POSTGRES_PASSWORD: sauti
          POSTGRES_DB: sauti_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sauti" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sauti:sauti@localhost:5432/sauti_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts
      - name: Tests (mock ASR + mock LLM)
        run: pytest -q

  web:
    name: Web lint and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npm run build

  stack:
    name: Docker images and stack smoke test
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Write a CI .env (mock providers, no GPU)
        run: bash deploy/ci/make-env.sh > .env
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml --env-file .env build api web
      - name: Start the stack
        run: docker compose -f deploy/docker-compose.yml --env-file .env up -d
      - name: Smoke test (login, ingest, pipeline, export)
        run: bash deploy/ci/smoke-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs --tail 200
      - name: Stop
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file .env down -v

  gpu-image:
    name: GPU worker image
    runs-on: ubuntu-24.04
    needs: [backend]
    if: github.event_name == 'workflow_dispatch' && inputs.gpu_image
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (CUDA wheels are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: Build
        run: docker build -f backend/Dockerfile.gpu -t sauti-qa/backend-gpu:ci backend
      - name: Check CUDA libraries and ASR stack import
        run: |
          docker run --rm sauti-qa/backend-gpu:ci python -c "import torch, transformers, faster_whisper, pyannote.audio, silero_vad; print('torch', torch.__version__, 'cuda build', torch.version.cuda)"
